name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
            artifact_name: routin-exe-jar
            build_artifact: ""
          - os: windows-latest
            classifier: win
            artifact_name: routin-exe-windows
            build_artifact: exe
          - os: macos-latest
            classifier: mac
            artifact_name: routin-exe-macos
            build_artifact: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -Plinux

      - name: Collect JavaFX jars
        shell: bash
        run: |
          mkdir -p jfx-deps
          CLASSIFIER="${{ matrix.classifier }}"
          echo "Classifier: $CLASSIFIER"

          for mod in base controls graphics media; do
            JAR=$(find ~/.m2/repository/org/openjfx -name "javafx-${mod}-25.0.4-${CLASSIFIER}.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
            if [ -z "$JAR" ]; then
              echo "ERROR: JavaFX ${mod} jar not found for $CLASSIFIER"
              exit 1
            fi
            cp "$JAR" jfx-deps/
            echo "Copied: $(basename $JAR)"
          done

          ls -la jfx-deps/

      - name: Generate Windows ICO icon
        if: matrix.os == 'windows-latest'
        shell: bash
        continue-on-error: true
        run: magick convert src/main/resources/routinexe.png -define icon:auto-resize=256,128,64,48,32,16 src/main/resources/routinexe.ico

      - name: Generate macOS ICNS icon
        if: matrix.os == 'macos-latest'
        shell: bash
        continue-on-error: true
        run: |
          rm -rf src/main/resources/routinexe.iconset
          mkdir -p src/main/resources/routinexe.iconset
          sips -z 16x16     src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_16x16.png" 2>/dev/null
          sips -z 32x32     src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_16x16@2x.png" 2>/dev/null
          sips -z 32x32     src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_32x32.png" 2>/dev/null
          sips -z 64x64     src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_32x32@2x.png" 2>/dev/null
          sips -z 128x128   src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_128x128.png" 2>/dev/null
          sips -z 256x256   src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_128x128@2x.png" 2>/dev/null
          sips -z 256x256   src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_256x256.png" 2>/dev/null
          sips -z 512x512   src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_256x256@2x.png" 2>/dev/null
          sips -z 512x512   src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_512x512.png" 2>/dev/null
          sips -z 1024x1024 src/main/resources/routinexe.png --out "src/main/resources/routinexe.iconset/icon_512x512@2x.png" 2>/dev/null
          iconutil -c icns "src/main/resources/routinexe.iconset" -o src/main/resources/routinexe.icns 2>&1

      - name: Build native package - Windows (EXE)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ICON_OPT=""
          if [ -f "src/main/resources/routinexe.ico" ]; then
            ICON_OPT="--icon src/main/resources/routinexe.ico"
          fi

          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --input target \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jfx-deps \
            --type exe \
            --dest release-artifacts \
            --java-options "-Xmx512m" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            $ICON_OPT

      - name: Build native package - macOS (DMG)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ICON_OPT=""
          if [ -f "src/main/resources/routinexe.icns" ]; then
            ICON_OPT="--icon src/main/resources/routinexe.icns"
          fi

          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --input target \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jfx-deps \
            --type dmg \
            --dest release-artifacts \
            --java-options "-Xmx512m" \
            $ICON_OPT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-jar
          path: target/routin-exe.jar

      - name: Upload Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-artifacts/*

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-artifacts/*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            artifacts/routin-exe.jar
            artifacts/RoutinEXE-*.exe
            artifacts/RoutinEXE-*.dmg
