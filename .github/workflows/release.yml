name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
            type: app-image
          - os: windows-latest
            classifier: win
            type: exe
          - os: macos-latest
            classifier: mac
            type: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -Plinux

      - name: Collect native dependencies
        shell: bash
        run: |
          mkdir -p jpackage-deps
          CLASSIFIER="${{ matrix.classifier }}"
          echo "Classifier: $CLASSIFIER"

          # JavaFX jars
          for mod in base controls graphics media; do
            JAR=$(find ~/.m2/repository/org/openjfx -name "javafx-${mod}-25.0.4-${CLASSIFIER}.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
            if [ -z "$JAR" ]; then
              echo "ERROR: JavaFX ${mod} jar not found for $CLASSIFIER"
              exit 1
            fi
            cp "$JAR" jpackage-deps/
            echo "Copied: $(basename $JAR)"
          done

          # SQLite JDBC
          SQLITE_JAR=$(find ~/.m2/repository/org/xerial -name "sqlite-jdbc-*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          cp "$SQLITE_JAR" jpackage-deps/
          SQLITE_BASENAME=$(basename "$SQLITE_JAR")
          echo "SQLITE_BASENAME=$SQLITE_BASENAME" >> $GITHUB_ENV
          echo "Copied: $SQLITE_BASENAME"

          ls -la jpackage-deps/

      - name: Package - Linux (AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

          # Build jpackage app-image
          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon src/main/resources/routinexe.png \
            --input dist \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jpackage-deps \
            --class-path "${SQLITE_BASENAME}" \
            --type app-image \
            --dest jpackage-out \
            --java-options "-Xmx512m"

          # Create AppDir for appimagetool
          rm -rf AppDir
          mkdir -p AppDir/data
          mkdir -p AppDir/usr/lib/app
          mkdir -p AppDir/usr/lib/javafx
          mkdir -p AppDir/usr/lib/runtime

          # Copy app jar
          cp jpackage-out/RoutinEXE/lib/routin-exe.jar AppDir/usr/lib/app/

          # Copy JavaFX jars
          cp jpackage-deps/javafx-*.jar AppDir/usr/lib/javafx/

          # Copy SQLite jar
          cp jpackage-deps/${SQLITE_BASENAME} AppDir/usr/lib/

          # Copy bundled runtime
          cp -r jpackage-out/RoutinEXE/runtime/* AppDir/usr/lib/runtime/

          # Copy seed data
          cp data/seed.sql AppDir/data/

          # Build classpath string for AppRun
          JAVAFX_CP=""
          for jar in AppDir/usr/lib/javafx/*.jar; do
            JAVAFX_CP="$JAVAFX_CP:\$HERE/usr/lib/javafx/$(basename $jar)"
          done

          # Create AppRun
          cat > AppDir/AppRun << EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/lib/runtime/bin/java" \\
            --module-path "\$HERE/usr/lib/javafx" \\
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \\
            -classpath "\$HERE/usr/lib/app/routin-exe.jar:\$HERE/usr/lib/${SQLITE_BASENAME}${JAVAFX_CP}" \\
            com.routineexe.view.Main "\$@"
          EOF
          chmod +x AppDir/AppRun

          # Create desktop file
          cat > AppDir/RoutinEXE.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=RoutinEXE
          Exec=AppRun
          Icon=routinexe
          Type=Application
          Categories=Education;
          DESKTOP

          # Copy icon
          cp src/main/resources/routinexe.png AppDir/RoutinEXE.png

          # Build AppImage
          /tmp/appimagetool.AppImage AppDir dist/RoutinEXE-x86_64.AppImage

      - name: Package - Windows (EXE)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Convert paths for Windows
          ICON_PATH="src/main/resources/routinexe.png"
          SQLITE_JAR_NAME="${SQLITE_BASENAME}"

          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon "$ICON_PATH" \
            --input dist \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jpackage-deps \
            --class-path "$SQLITE_JAR_NAME" \
            --type exe \
            --dest release-artifacts \
            --java-options "-Xmx512m" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu

      - name: Package - macOS (DMG)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon src/main/resources/routinexe.png \
            --input dist \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jpackage-deps \
            --class-path "${SQLITE_BASENAME}" \
            --type dmg \
            --dest release-artifacts \
            --java-options "-Xmx512m"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-jar
          path: dist/routin-exe.jar

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-linux
          path: |
            dist/RoutinEXE-x86_64.AppImage

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-windows
          path: |
            release-artifacts/*

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-macos
          path: |
            release-artifacts/*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            artifacts/routin-exe.jar
            artifacts/RoutinEXE-x86_64.AppImage
            artifacts/*.exe
            artifacts/*.dmg
