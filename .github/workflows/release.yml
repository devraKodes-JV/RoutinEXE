name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux
            pkg_type: app-image
            artifact_name: routin-exe-linux
          - os: windows-latest
            classifier: win
            pkg_type: exe
            artifact_name: routin-exe-windows
          - os: macos-latest
            classifier: mac
            pkg_type: dmg
            artifact_name: routin-exe-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build JAR (includes SQLite JDBC via shade plugin)
        run: mvn clean package -Plinux

      - name: Collect JavaFX jars
        shell: bash
        run: |
          mkdir -p jfx-deps
          CLASSIFIER="${{ matrix.classifier }}"
          echo "Classifier: $CLASSIFIER"

          for mod in base controls graphics media; do
            JAR=$(find ~/.m2/repository/org/openjfx -name "javafx-${mod}-25.0.4-${CLASSIFIER}.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
            if [ -z "$JAR" ]; then
              echo "ERROR: JavaFX ${mod} jar not found for $CLASSIFIER"
              exit 1
            fi
            cp "$JAR" jfx-deps/
            echo "Copied: $(basename $JAR)"
          done

          ls -la jfx-deps/

      - name: Generate platform icon
        if: matrix.os == 'windows-latest'
        run: magick convert src/main/resources/routinexe.png -define icon:auto-resize=256,128,64,48,32,16 src/main/resources/routinexe.ico
        shell: bash

      - name: Generate platform icon
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p src/main/resources/routinexe.iconset
          sips -z 16x16     src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_16x16.png
          sips -z 32x32     src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_16x16@2x.png
          sips -z 32x32     src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_32x32.png
          sips -z 64x64     src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_32x32@2x.png
          sips -z 128x128   src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_128x128.png
          sips -z 256x256   src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_128x128@2x.png
          sips -z 256x256   src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_256x256.png
          sips -z 512x512   src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_256x256@2x.png
          sips -z 512x512   src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_512x512.png
          sips -z 1024x1024 src/main/resources/routinexe.png --out src/main/resources/routinexe.iconset/icon_512x512@2x.png
          iconutil -c icns src/main/resources/routinexe.iconset -o src/main/resources/routinexe.icns

      - name: Package - Linux (AppImage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Install libfuse2 for appimagetool
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

          # Build jpackage app-image
          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon src/main/resources/routinexe.png \
            --input target \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jfx-deps \
            --type app-image \
            --dest jpackage-out \
            --java-options "-Xmx512m"

          # Create AppDir for appimagetool from jpackage output
          rm -rf AppDir
          mkdir -p AppDir/usr/lib/app
          mkdir -p AppDir/usr/lib/javafx
          mkdir -p AppDir/usr/lib/runtime
          mkdir -p AppDir/data

          # Copy app jar (fat JAR includes SQLite JDBC)
          cp target/routin-exe.jar AppDir/usr/lib/app/

          # Copy JavaFX jars
          cp jfx-deps/javafx-*.jar AppDir/usr/lib/javafx/

          # Copy bundled runtime from jpackage
          if [ -d jpackage-out/RoutinEXE/runtime ]; then
            cp -r jpackage-out/RoutinEXE/runtime/* AppDir/usr/lib/runtime/
          fi

          # Copy seed data
          cp data/seed.sql AppDir/data/

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          JAVAFX_JARS=""
          for jar in "$HERE/usr/lib/javafx"/*.jar; do
            JAVAFX_JARS="$JAVAFX_JARS:$jar"
          done
          exec "$HERE/usr/lib/runtime/bin/java" \
            --module-path "$HERE/usr/lib/javafx" \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            -classpath "$HERE/usr/lib/app/routin-exe.jar:$JAVAFX_JARS" \
            com.routineexe.view.Main "$@"
          EOF
          chmod +x AppDir/AppRun

          # Create desktop file
          cat > AppDir/RoutinEXE.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=RoutinEXE
          Exec=AppRun
          Icon=routinexe
          Type=Application
          Categories=Education;
          DESKTOP

          # Copy icon
          cp src/main/resources/routinexe.png AppDir/

          # Build AppImage
          /tmp/appimagetool.AppImage AppDir dist/RoutinEXE-x86_64.AppImage

      - name: Package - Windows (EXE)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon src/main/resources/routinexe.ico \
            --input target \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jfx-deps \
            --type exe \
            --dest release-artifacts \
            --java-options "-Xmx512m" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu

      - name: Package - macOS (DMG)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          jpackage \
            --name RoutinEXE \
            --app-version 1.0.0 \
            --icon src/main/resources/routinexe.icns \
            --input target \
            --main-jar routin-exe.jar \
            --main-class com.routineexe.view.Main \
            --add-modules javafx.base,javafx.controls,javafx.graphics,javafx.media \
            --module-path jfx-deps \
            --type dmg \
            --dest release-artifacts \
            --java-options "-Xmx512m"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: routin-exe-jar
          path: target/routin-exe.jar

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/RoutinEXE-x86_64.AppImage

      - name: Upload Windows EXE
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-artifacts/*

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release-artifacts/*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            artifacts/routin-exe.jar
            artifacts/RoutinEXE-x86_64.AppImage
            artifacts/*.exe
            artifacts/*.dmg
