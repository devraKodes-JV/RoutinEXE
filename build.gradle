plugins {
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.routineexe.view.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
}

javafx {
    version = '25.0.4'
    modules = [ 'javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.media' ]
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.routineexe.view.Main'
        )
    }
}